name: Compilar Patagonia Sound

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    name: Compilar el motor (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Visual Studio (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compilar PatagoniaSound.dll
        shell: cmd
        run: >
          cl /nologo /LD /O2 /EHsc /std:c++17 /MT /W4 /WX- /DUNICODE /D_UNICODE
          motor\PatagoniaSound.cpp
          /Fe:PatagoniaSound.dll
          /link /DEF:motor\PatagoniaSound.def /MANIFEST:NO ole32.lib uuid.lib

      - name: Revisar la DLL (exporta lo que Windows necesita)
        shell: cmd
        run: dumpbin /exports PatagoniaSound.dll | findstr /C:"DllGetClassObject" /C:"DllCanUnloadNow"

      - name: Revisar la sintaxis de los scripts
        shell: powershell
        run: |
          $mal = 0
          foreach ($f in Get-ChildItem instalador -Filter *.ps1) {
            $errores = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errores) | Out-Null
            foreach ($e in $errores) { Write-Host "::error file=$($f.Name)::$($e.Message) (línea $($e.Extent.StartLineNumber))"; $mal++ }
          }
          if ($mal) { exit 1 }

      - name: Probar que el instalador pueda escribir claves de audio protegidas
        shell: powershell
        run: .\instalador\prueba-permisos.ps1

      - name: Armar el paquete
        shell: powershell
        run: |
          $d = 'paquete\Patagonia-Sound'
          New-Item -ItemType Directory -Force "$d\instalador" | Out-Null
          Copy-Item PatagoniaSound.dll $d
          Copy-Item instalador\*.cmd $d
          Copy-Item instalador\*.ps1 "$d\instalador" -Exclude prueba-*
          Copy-Item LEEME.txt $d
          Compress-Archive -Path $d -DestinationPath Patagonia-Sound-prueba.zip -Force

      - name: Guardar el paquete
        uses: actions/upload-artifact@v4
        with:
          name: Patagonia-Sound-prueba
          path: Patagonia-Sound-prueba.zip

      # En main, el paquete queda siempre en el mismo link para bajarlo directo:
      # https://github.com/Roma-69/Patagonia-Sound/releases/download/motor-prueba/Patagonia-Sound-prueba.zip
      - name: Publicar la versión de prueba
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete motor-prueba --yes --cleanup-tag 2>/dev/null || true
          gh release create motor-prueba Patagonia-Sound-prueba.zip \
            --prerelease --target "${{ github.sha }}" \
            --title "Motor de prueba (${GITHUB_SHA::7})" \
            --notes "Paso 1: prueba del motor propio de Patagonia Sound (refuerzo de graves). Bajá el zip, descomprimilo y seguí LEEME.txt."
